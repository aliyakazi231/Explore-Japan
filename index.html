  <section class="content"><div class="copy"><div class="eyebrow">Japan · 日本 · 2026</div><h1>EXPLORE<br><span>JAPAN</span></h1><p>Travel through neon cities, sacred temples, alpine landscapes and island shores in an immersive 3D journey across Japan.</p><div class="actions"><a class="button primary" href="destinations.html">Begin Journey <b>→</b></a><a class="button secondary" href="booking.html">Book Now</a></div></div></section><div class="scroll">Scroll to dream</div><div class="kanji">東京　京都　大阪　北海道</div>

<script type="module">
import * as THREE from 'three'; import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
const canvas=document.querySelector('#scene'), scene=new THREE.Scene(); scene.fog=new THREE.FogExp2(0x07070a,.055);
const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,.1,100); camera.position.set(0,3.6,12);
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true}); renderer.setPixelRatio(Math.min(devicePixelRatio,2)); renderer.setSize(innerWidth,innerHeight); renderer.toneMapping=THREE.ACESFilmicToneMapping;
const controls=new OrbitControls(camera,renderer.domElement); controls.enableDamping=true;controls.enablePan=false;controls.minDistance=8;controls.maxDistance=15;controls.maxPolarAngle=Math.PI*.49;controls.target.set(0,1.5,0);
scene.add(new THREE.HemisphereLight(0x7c6b8c,0x07070a,1.3)); const sun=new THREE.DirectionalLight(0xffdfc0,2.8);sun.position.set(4,8,5);scene.add(sun);const glow=new THREE.PointLight(0xd7263d,22,17,2);glow.position.set(-3,2,3);scene.add(glow);
const ground=new THREE.Mesh(new THREE.CylinderGeometry(8.8,8.8,.24,72),new THREE.MeshStandardMaterial({color:0x111015,roughness:.85,metalness:.12}));ground.position.y=-.14;scene.add(ground);
const mountain=new THREE.Mesh(new THREE.ConeGeometry(4.1,6.1,7),new THREE.MeshStandardMaterial({color:0x252733,flatShading:true,roughness:.95}));mountain.position.y=2.9;mountain.rotation.y=.18;scene.add(mountain);
const snow=new THREE.Mesh(new THREE.ConeGeometry(1.58,1.48,7),new THREE.MeshStandardMaterial({color:0xe7e5df,flatShading:true,roughness:.8}));snow.position.y=6.08;snow.rotation.y=.18;scene.add(snow);
function box(w,h,d,x,y,z,mat){let m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);m.position.set(x,y,z);scene.add(m)} const red=new THREE.MeshStandardMaterial({color:0xa9152b,roughness:.5,metalness:.2}), darkred=new THREE.MeshStandardMaterial({color:0x77101f});
box(.34,3.1,.38,-3.1,1.42,1.55,red);box(.34,3.1,.38,.2,1.42,1.55,red);box(4.2,.36,.56,-1.45,3,1.55,red);box(4.65,.18,.67,-1.45,3.35,1.55,darkred);box(.16,.7,.3,-2.7,2.42,1.55,red);box(.16,.7,.3,-.2,2.42,1.55,red);
const count=innerWidth<560?180:420, pos=new Float32Array(count*3);for(let i=0;i<count;i++){pos[i*3]=(Math.random()-.5)*18;pos[i*3+1]=Math.random()*11;pos[i*3+2]=(Math.random()-.5)*10}const petals=new THREE.BufferGeometry();petals.setAttribute('position',new THREE.BufferAttribute(pos,3));const points=new THREE.Points(petals,new THREE.PointsMaterial({color:0xff9dac,size:.075,transparent:true,opacity:.8,sizeAttenuation:true}));scene.add(points);
let targetX=0,targetY=0;addEventListener('pointermove',e=>{targetX=(e.clientX/innerWidth-.5)*.45;targetY=(e.clientY/innerHeight-.5)*.22});addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});function loop(){requestAnimationFrame(loop);const p=petals.attributes.position.array;for(let i=0;i<count;i++){p[i*3+1]-=.016;if(p[i*3+1]<-.2){p[i*3+1]=10;p[i*3]=(Math.random()-.5)*18}}petals.attributes.position.needsUpdate=true;scene.rotation.y+=(targetX-scene.rotation.y)*.012;scene.rotation.x+=(targetY-scene.rotation.x)*.01;controls.update();renderer.render(scene,camera)}loop();
</script><script>const b=document.querySelector('.hamburger'),m=document.querySelector('.mobile-menu');b.onclick=()=>{m.classList.toggle('open');b.setAttribute('aria-expanded',m.classList.contains('open'))}</script>
