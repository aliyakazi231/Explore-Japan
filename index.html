<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Explore Japan — Immersive Journeys</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#07070a;--ink:#f4efe6;--red:#d7263d;--gold:#c9a227;--glass:rgba(16,16,21,.63)}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,Arial,sans-serif}body{overflow-x:hidden}.hero{min-height:100vh;position:relative;isolation:isolate;background:radial-gradient(circle at 68% 55%,#291116 0,transparent 30%),linear-gradient(130deg,#07070a,#111015 70%,#09070a);overflow:hidden}canvas{position:absolute;inset:0;width:100%;height:100%;z-index:-2}.grain{position:absolute;inset:0;z-index:-1;opacity:.2;pointer-events:none;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 150 150' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.95' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.42'/%3E%3C/svg%3E")}nav{height:88px;display:flex;align-items:center;justify-content:space-between;max-width:1280px;padding:0 5vw;margin:auto;position:relative;z-index:2}.brand{font-family:Cinzel,serif;font-size:18px;letter-spacing:.18em;color:var(--ink);text-decoration:none}.brand em{font-style:normal;color:var(--red)}.navlinks{display:flex;align-items:center;gap:31px}.navlinks a{color:#ddd7cd;text-decoration:none;font-size:13px;transition:color .25s}.navlinks a:hover,.navlinks a.active{color:var(--gold)}.navlinks .nav-cta{border:1px solid rgba(201,162,39,.7);padding:11px 17px;border-radius:999px;color:var(--gold)}.hamburger{display:none;background:none;border:0;color:var(--ink);font-size:25px}.mobile-menu{display:none}.content{min-height:calc(100vh - 88px);max-width:1280px;margin:auto;padding:9vh 5vw 9vh;display:flex;align-items:center}.copy{max-width:610px}.eyebrow{display:flex;align-items:center;gap:11px;color:var(--gold);font-size:11px;letter-spacing:.2em;text-transform:uppercase}.eyebrow:before{content:'';width:34px;height:1px;background:var(--red)}h1{font-family:Cinzel,serif;font-size:clamp(50px,8.6vw,120px);line-height:.94;letter-spacing:.03em;margin:24px 0 24px;font-weight:600}h1 span{color:var(--red);text-shadow:0 0 28px rgba(215,38,61,.27)}.copy p{color:#c8c1b7;line-height:1.8;font-size:15px;max-width:490px;margin:0 0 35px}.actions{display:flex;gap:13px;flex-wrap:wrap}.button{display:inline-flex;align-items:center;gap:15px;border-radius:999px;padding:15px 22px;text-decoration:none;font-size:12px;font-weight:600;letter-spacing:.06em;transition:.25s}.primary{background:var(--red);color:#fff;box-shadow:0 12px 30px rgba(215,38,61,.2)}.primary:hover{transform:translateY(-3px);background:#e03850}.secondary{color:var(--ink);border:1px solid rgba(244,239,230,.28);background:rgba(255,255,255,.03);backdrop-filter:blur(8px)}.secondary:hover{border-color:var(--gold);color:var(--gold)}.scroll{position:absolute;bottom:34px;left:5vw;color:#aaa49a;font-size:10px;letter-spacing:.18em;text-transform:uppercase;writing-mode:vertical-rl;display:flex;gap:12px;align-items:center}.scroll:after{content:'';height:55px;width:1px;background:linear-gradient(var(--gold),transparent)}.kanji{position:absolute;right:5vw;bottom:34px;font-family:Cinzel,serif;font-size:11px;letter-spacing:.35em;color:rgba(244,239,230,.38)}
    @media(max-width:860px){.navlinks{display:none}.hamburger{display:block}.mobile-menu{position:absolute;top:75px;right:5vw;width:210px;padding:12px;z-index:4;border:1px solid rgba(255,255,255,.13);background:#121116ed;backdrop-filter:blur(12px);border-radius:16px}.mobile-menu.open{display:grid}.mobile-menu a{padding:12px;color:var(--ink);text-decoration:none;font-size:13px}.content{padding-top:6vh}.copy{max-width:520px}.scroll{display:none}}@media(max-width:560px){nav{height:72px}.brand{font-size:15px}.content{min-height:calc(100vh - 72px);padding-top:3vh;align-items:flex-start}.copy{padding-top:45px}h1{font-size:51px}.copy p{font-size:14px;line-height:1.7}.actions{display:grid;grid-template-columns:1fr}.button{justify-content:center}.kanji{bottom:22px;font-size:9px}}
  </style>
  <script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.161.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.161.0/examples/jsm/"}}</script>
</head>
<body><main class="hero"><canvas id="scene" aria-label="A stylized 3D Mount Fuji scene"></canvas><div class="grain"></div>
  <nav><a class="brand" href="index.html">EXPLORE <em>JAPAN</em></a><div class="navlinks"><a class="active" href="index.html">Home</a><a href="destinations.html">Destinations</a><a class="nav-cta" href="booking.html">Book Now</a></div><button class="hamburger" aria-label="Open menu" aria-expanded="false">☰</button><div class="mobile-menu"><a href="index.html">Home</a><a href="destinations.html">Destinations</a><a href="booking.html">Book Now</a></div></nav>
  <section class="content"><div class="copy"><div class="eyebrow">Japan · 日本 · 2026</div><h1>EXPLORE<br><span>JAPAN</span></h1><p>Travel through neon cities, sacred temples, alpine landscapes and island shores in an immersive journey across Japan.</p><div class="actions"><a class="button primary" href="destinations.html">Begin Journey <b>→</b></a><a class="button secondary" href="booking.html">Book Now</a></div></div></section><div class="scroll">Scroll to dream</div><div class="kanji">東京　京都　大阪　北海道</div>
</main>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const canvas = document.querySelector('#scene');
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x07070a, 0.028);

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 100);
camera.position.set(0, 4.8, 14);

const renderer = new THREE.WebGLRenderer({
  canvas,
  antialias: true,
  alpha: true
});

renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.enablePan = false;
controls.minDistance = 9;
controls.maxDistance = 16;
controls.maxPolarAngle = Math.PI * 0.48;
controls.target.set(2.2, 2.3, 0);

scene.add(new THREE.HemisphereLight(0x8ea0c8, 0x09070a, 1.5));

const moonLight = new THREE.DirectionalLight(0xe8e1d2, 2.4);
moonLight.position.set(-5, 10, 5);
scene.add(moonLight);

const redLight = new THREE.PointLight(0xd7263d, 28, 19, 2);
redLight.position.set(1, 2, 4);
scene.add(redLight);

const goldLight = new THREE.PointLight(0xc9a227, 9, 13, 2);
goldLight.position.set(5, 4, -1);
scene.add(goldLight);

const world = new THREE.Group();
world.position.x = 1.6;
scene.add(world);

const lake = new THREE.Mesh(
  new THREE.CircleGeometry(10, 80),
  new THREE.MeshStandardMaterial({
    color: 0x101a2c,
    metalness: 0.7,
    roughness: 0.18,
    transparent: true,
    opacity: 0.82
  })
);

lake.rotation.x = -Math.PI / 2;
lake.position.y = -0.12;
world.add(lake);

const ground = new THREE.Mesh(
  new THREE.CylinderGeometry(10.4, 10.4, 0.32, 80),
  new THREE.MeshStandardMaterial({
    color: 0x0c0b10,
    roughness: 0.9,
    metalness: 0.15
  })
);

ground.position.y = -0.35;
world.add(ground);

const fuji = new THREE.Mesh(
  new THREE.ConeGeometry(4.35, 6.8, 8),
  new THREE.MeshStandardMaterial({
    color: 0x222937,
    roughness: 0.92,
    flatShading: true
  })
);

fuji.position.set(1.4, 3.1, -3.2);
fuji.rotation.y = 0.2;
world.add(fuji);

const snowCap = new THREE.Mesh(
  new THREE.ConeGeometry(1.72, 1.68, 8),
  new THREE.MeshStandardMaterial({
    color: 0xf2eee7,
    roughness: 0.76,
    flatShading: true
  })
);

snowCap.position.set(1.4, 6.55, -3.2);
snowCap.rotation.y = 0.2;
world.add(snowCap);

function addBox(width, height, depth, x, y, z, material) {
  const part = new THREE.Mesh(
    new THREE.BoxGeometry(width, height, depth),
    material
  );

  part.position.set(x, y, z);
  world.add(part);
}

const toriiRed = new THREE.MeshStandardMaterial({
  color: 0xb91d32,
  roughness: 0.45,
  metalness: 0.25
});

const toriiDark = new THREE.MeshStandardMaterial({
  color: 0x7d1020,
  roughness: 0.55
});

addBox(0.34, 3.25, 0.38, -1.8, 1.35, 1.5, toriiRed);
addBox(0.34, 3.25, 0.38, 1.7, 1.35, 1.5, toriiRed);
addBox(4.35, 0.36, 0.56, -0.05, 2.96, 1.5, toriiRed);
addBox(4.82, 0.18, 0.67, -0.05, 3.32, 1.5, toriiDark);
addBox(0.18, 0.82, 0.3, -1.42, 2.36, 1.5, toriiRed);
addBox(0.18, 0.82, 0.3, 1.32, 2.36, 1.5, toriiRed);

function pagodaRoof(size, y) {
  const roof = new THREE.Mesh(
    new THREE.ConeGeometry(size, 0.52, 4),
    new THREE.MeshStandardMaterial({
      color: 0x55131e,
      roughness: 0.7,
      flatShading: true
    })
  );

  roof.position.set(4.55, y, -0.3);
  roof.rotation.y = Math.PI / 4;
  world.add(roof);
}

function pagodaLevel(width, y) {
  const level = new THREE.Mesh(
    new THREE.BoxGeometry(width, 0.82, width),
    new THREE.MeshStandardMaterial({
      color: 0x24191a,
      roughness: 0.85
    })
  );

  level.position.set(4.55, y, -0.3);
  world.add(level);
}

pagodaLevel(1.65, 0.5);
pagodaRoof(1.55, 1.12);
pagodaLevel(1.25, 1.4);
pagodaRoof(1.23, 2.02);
pagodaLevel(0.92, 2.28);
pagodaRoof(0.9, 2.9);

const pagodaTop = new THREE.Mesh(
  new THREE.CylinderGeometry(0.05, 0.05, 1.2, 8),
  new THREE.MeshStandardMaterial({ color: 0xc9a227, metalness: 0.7 })
);

pagodaTop.position.set(4.55, 3.38, -0.3);
world.add(pagodaTop);

function cherryTree(x, z, scale = 1) {
  const tree = new THREE.Group();

  const trunk = new THREE.Mesh(
    new THREE.CylinderGeometry(0.11 * scale, 0.19 * scale, 2.4 * scale, 7),
    new THREE.MeshStandardMaterial({
      color: 0x32191c,
      roughness: 0.9
    })
  );

  trunk.position.y = 1.1 * scale;
  tree.add(trunk);

  const branchMaterial = new THREE.MeshStandardMaterial({
    color: 0x3d1d25,
    roughness: 0.85
  });

  for (let i = 0; i < 5; i++) {
    const branch = new THREE.Mesh(
      new THREE.CylinderGeometry(0.035 * scale, 0.075 * scale, 1.35 * scale, 6),
      branchMaterial
    );

    branch.position.set(
      Math.cos(i * 1.25) * 0.34 * scale,
      1.75 * scale,
      Math.sin(i * 1.25) * 0.34 * scale
    );

    branch.rotation.z = 0.7 + Math.sin(i) * 0.35;
    branch.rotation.y = i * 1.25;
    tree.add(branch);
  }

  const blossomMaterial = new THREE.MeshStandardMaterial({
    color: 0xffa5b7,
    roughness: 0.7,
    flatShading: true
  });

  for (let i = 0; i < 23; i++) {
    const blossom = new THREE.Mesh(
      new THREE.IcosahedronGeometry((0.18 + Math.random() * 0.16) * scale, 1),
      blossomMaterial
    );

    blossom.position.set(
      (Math.random() - 0.5) * 2.2 * scale,
      2.45 * scale + Math.random() * 1.15 * scale,
      (Math.random() - 0.5) * 2.2 * scale
    );

    tree.add(blossom);
  }

  tree.position.set(x, 0, z);
  world.add(tree);
}

cherryTree(-3.8, 0.5, 1.15);
cherryTree(3.2, 1.5, 0.8);
cherryTree(-4.5, -2.4, 0.7);

function cloud(x, y, z, scale) {
  const cloudGroup = new THREE.Group();

  const material = new THREE.MeshStandardMaterial({
    color: 0x7e7b8e,
    transparent: true,
    opacity: 0.2,
    roughness: 0.95
  });

  for (let i = 0; i < 5; i++) {
    const puff = new THREE.Mesh(
      new THREE.SphereGeometry(scale * (0.45 + Math.random() * 0.35), 16, 12),
      material
    );

    puff.position.set(i * scale * 0.5, Math.sin(i) * scale * 0.2, 0);
    cloudGroup.add(puff);
  }

  cloudGroup.position.set(x, y, z);
  world.add(cloudGroup);
}

cloud(-5.5, 5.2, -5, 0.8);
cloud(3.5, 7.2, -6, 0.65);

const particleCount = innerWidth < 560 ? 160 : 480;
const petalPositions = new Float32Array(particleCount * 3);
const petalSpeeds = [];

for (let i = 0; i < particleCount; i++) {
  petalPositions[i * 3] = (Math.random() - 0.5) * 18;
  petalPositions[i * 3 + 1] = Math.random() * 11;
  petalPositions[i * 3 + 2] = (Math.random() - 0.5) * 10;
  petalSpeeds.push(0.009 + Math.random() * 0.02);
}

const petalsGeometry = new THREE.BufferGeometry();
petalsGeometry.setAttribute(
  'position',
  new THREE.BufferAttribute(petalPositions, 3)
);

const petals = new THREE.Points(
  petalsGeometry,
  new THREE.PointsMaterial({
    color: 0xffa0b4,
    size: 0.07,
    transparent: true,
    opacity: 0.86,
    sizeAttenuation: true
  })
);

scene.add(petals);

let mouseX = 0;
let mouseY = 0;

addEventListener('pointermove', (event) => {
  mouseX = (event.clientX / innerWidth - 0.5) * 0.55;
  mouseY = (event.clientY / innerHeight - 0.5) * 0.22;
});

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

function animate() {
  requestAnimationFrame(animate);

  const positions = petalsGeometry.attributes.position.array;

  for (let i = 0; i < particleCount; i++) {
    positions[i * 3 + 1] -= petalSpeeds[i];
    positions[i * 3] += Math.sin(Date.now() * 0.001 + i) * 0.003;

    if (positions[i * 3 + 1] < -0.3) {
      positions[i * 3 + 1] = 10;
      positions[i * 3] = (Math.random() - 0.5) * 18;
    }
  }

  petalsGeometry.attributes.position.needsUpdate = true;

  world.rotation.y += (mouseX - world.rotation.y) * 0.012;
  world.rotation.x += (mouseY - world.rotation.x) * 0.008;

  lake.material.opacity = 0.72 + Math.sin(Date.now() * 0.0015) * 0.1;

  controls.update();
  renderer.render(scene, camera);
}

animate();
</script>
  
 <script>const b=document.querySelector('.hamburger'),m=document.querySelector('.mobile-menu');b.onclick=()=>{m.classList.toggle('open');b.setAttribute('aria-expanded',m.classList.contains('open'))}</script>
